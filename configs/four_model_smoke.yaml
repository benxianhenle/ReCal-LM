model_type: four_model
name: FourModel-smoke
vocab_size: 32000
context_length: 256
hidden_size: 128
num_heads: 4
ffn_dim: 256
front_layers: 1
recurrent_layers: 2
back_layers: 1
drift_hidden_size: 64
dropout: 0.0
gradient_checkpointing: true
rollout_steps: 2
ema_decay: 0.99
lambda_core: 1.0
lambda_attention: 1.0
lambda_drift: 0.05
precision: bf16
training:
  learning_rate: 0.0003
  weight_decay: 0.1
  warmup_steps: 2
  grad_accum: 1
  batch_size: 1
  seq_len: 64
  validation_interval: 1
  validation_batches: 2
  plateau_patience: 5
  plateau_relative_tolerance: 0.001
  spike_relative_threshold: 0.02
