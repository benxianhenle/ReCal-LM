model_type: recal
name: ReCal-LM-20M-smoke
vocab_size: 32000
context_length: 256
hidden_size: 384
num_heads: 6
head_dim: 64
nominal_ffn_dim: 1536
ffn_dim: 1024
front_layers: 2
recurrent_layers: 2
back_layers: 2
dropout: 0.1
tie_embeddings: true
loop_choices: [1, 2, 4]
loop_probs: [0.35, 0.40, 0.25]
router_hidden_size: 192
drift_hidden_size: 192
router_drift_thresholds: [0.10, 0.22]
router_exploration_prob: 0.10
drift_threshold: 0.30
lambda_state: 0.1
lambda_kd: 0.5
lambda_drift: 0.05
lambda_router: 0.01
lambda_consistency: 0.05
state_mse_weight: 0.25
kd_temperature: 2.0
consistency_temperature: 1.0
ema_teacher: true
ema_decay: 0.999
drift_accumulator_decay: 0.90
teacher_target_layers: [1, 2]
precision: fp16

training:
  learning_rate: 0.0003
  weight_decay: 0.1
  betas: [0.9, 0.95]
  warmup_steps: 10
  max_steps: 100
  attention_lr_scale: 0.10
