model_type: four_model
name: FourModel-R3B-TextState-v1
vocab_size: 32000
context_length: 2048
hidden_size: 3072
num_heads: 24
ffn_dim: 8192
front_layers: 2
recurrent_layers: 26
back_layers: 2
drift_hidden_size: 768
dropout: 0.0
gradient_checkpointing: true
rollout_steps: 2
ema_decay: 0.9995
lambda_core: 1.0
lambda_attention: 1.0
lambda_drift: 0.05
precision: bf16
training:
  learning_rate: 0.0001
  weight_decay: 0.1
  warmup_steps: 1000
  grad_accum: 8
  batch_size: 1
  seq_len: 512
  validation_interval: 500
  validation_batches: 8
  plateau_patience: 5
  plateau_relative_tolerance: 0.001
  spike_relative_threshold: 0.02
strategy: text_state_v1
depth_weights:
- 0.2
- 0.4
- 1.0
