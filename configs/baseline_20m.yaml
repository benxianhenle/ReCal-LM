model_type: baseline
name: Baseline-20M-smoke
vocab_size: 32000
context_length: 256
hidden_size: 384
num_heads: 6
head_dim: 64
nominal_ffn_dim: 1536
ffn_dim: 1024
num_layers: 6
dropout: 0.1
tie_embeddings: true
precision: fp16

training:
  learning_rate: 0.0003
  weight_decay: 0.1
  betas: [0.9, 0.95]
  warmup_steps: 10
  max_steps: 100

